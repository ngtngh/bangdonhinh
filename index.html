<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giải bảng đơn hình</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Giải bảng đơn hình (max)</h1>
    
    <div class="setup-panel">
        <div class="setup-row">
            <!-- Nhóm 1: Các input -->
            <div class="input-group">
                <label>Số biến ngoài cơ sở (Cột): <input type="number" id="numCols" value="2" min="1"></label>
                <label>Số biến cơ sở (Hàng): <input type="number" id="numRows" value="2" min="1"></label>
            </div>
            <!-- Nhóm 2: Nút bấm (Luôn muốn xuống dòng nếu nhóm 1 bị ngắt dòng) -->
            <div class="button-group">
                <button onclick="generateInputGrid()">Tạo Bảng Nhập Liệu</button>
            </div>
        </div>
    </div>

    <div id="inputGridContainer"></div>
    <div id="controls" style="display: none;">
        <button onclick="startSolving()" style="background: #2ecc71;">Giải Bài Toán</button>
    </div>

    <div id="outputArea"></div>

    <script src="script.js"></script>
</body>
</html>
