<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giải Bảng Đơn Hình</title>
    <link rel="icon" type="image/x-icon" href="table.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="content">
        <h1>Giải Bảng Đơn Hình</h1>
        
        <div class="tabs">
            <button class="tab-btn" id="tab-standard" onclick="setMode('standard')">Đơn hình gốc</button>
            <button class="tab-btn" id="tab-bigm" onclick="setMode('bigm')">Đơn hình Big-M</button>
            <button class="tab-btn" id="tab-dual" onclick="setMode('dual')">Đơn hình đối ngẫu</button>
        </div>

        <div class="setup-panel">
            <div class="setup-row">
                <div class="input-group">
                    <label>Số biến ngoài cơ sở (Cột): <input type="number" id="numCols" onfocus="clearValue(this)" onblur="restoreValue(this)" value="3" min="1"></label>
                    <label>Số biến cơ sở (Hàng): <input type="number" id="numRows" onfocus="clearValue(this)" onblur="restoreValue(this)" value="3" min="1"></label>
                </div>
                <div class="button-group">
                    <button onclick="generateInputGrid()">Tạo Bảng Nhập Liệu</button>
                </div>
            </div>
        </div>

        <div id="inputGridContainer"></div>
        <div id="controls" style="display: none; justify-content: center; align-items: center; position: relative; margin-top: 15px;">
            <!-- Nút chính (sẽ luôn nằm giữa do justify-content: center) -->
            <button id="solveButton" onclick="startSolving()">Giải Bảng Đơn Hình</button>
            
            <!-- Cụm nút phụ (ép sang phải bằng position: absolute) -->
            <div class="action-buttons">
                <button id="resetButton" onclick="resetProblem()" class="icon-btn" title="Làm mới bài toán">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                </button>
                <button id="shareLinkButton" onclick="copyShareLink()" class="icon-btn" title="Sao chép link">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                </button>
            </div>
        </div>

        <div id="outputArea"></div>
    </main>

    <footer>
        <p id="note"><strong><span style="color: red;">Lưu ý:</span></strong> Công cụ chỉ giải bảng đơn hình cho <strong>bài toán max ở dạng chính tắc</strong>. Chú ý <strong>đổi dấu giá trị tối ưu</strong> nếu đã chuyển từ min thành max.</p>
        <p>&copy; 2026 Nguyễn Tuấn Nghĩa.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
